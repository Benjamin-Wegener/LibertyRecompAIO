name: Android APK

# Builds the Android APK on a Windows runner, the platform the Android scripts
# in os/android/scripts were written and tested on (Git Bash + the NDK).
# Download the result from the run's "Artifacts" section.
#
# Starts by itself on a push to the mali-dimensity-8400 branch (except pushes that
# only change documentation), or by hand from the Actions tab. The native build is very large: the first run takes hours,
# and later runs are faster because the build folder is cached.

on:
  push:
    branches: [mali-dimensity-8400]
    # Changes that cannot affect the APK do not start a build: documentation,
    # images for the README, and the other workflows.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/build-macos.yml'
      - '.github/workflows/repository-checks.yml'
  workflow_dispatch:
    inputs:
      gpu:
        description: 'GPU family the APK defaults to'
        type: choice
        options: [mali, adreno]
        default: adreno
      lto:
        description: 'Link-time optimisation of the game code (thin = faster CPU code, much longer link)'
        type: choice
        options: [off, thin]
        default: off
      cpu:
        description: 'CPU target: compatible = all phones; armv9 = Dimensity 8400 and newer only (faster, crashes on older phones)'
        type: choice
        options: [compatible, armv9]
        default: compatible

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK (${{ inputs.gpu || 'adreno' }}, ${{ inputs.cpu || 'compatible' }})
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      LIBERTY_GPU: ${{ inputs.gpu || 'adreno' }}
      LIBERTY_CPU: ${{ inputs.cpu || 'compatible' }}
      LIBERTY_LTO: ${{ inputs.lto == 'thin' && 'thin' || 'off' }}
      NDK_VER: 29.0.14206865
      STRIP: '1'
      # ccache is a content-addressed cache: it reuses object files whose
      # preprocessed source is unchanged, even though a fresh submodule
      # checkout gives every file a new mtime and Ninja therefore rebuilds
      # everything. The directory is restored/saved below.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: 'true'
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Allow long paths
        run: git config --system core.longpaths true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CMake and Ninja
        run: python -m pip install 'cmake>=3.29,<5' ninja

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform and NDK r29
        run: |
          SDKMANAGER="$(cygpath -u "$ANDROID_HOME")/cmdline-tools/latest/bin/sdkmanager.bat"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;$NDK_VER" "platforms;android-35" "build-tools;35.0.0"

      - name: Install ccache
        run: |
          mkdir -p .ccache
          if ! command -v ccache >/dev/null 2>&1; then
            choco install ccache --no-progress -y || true
          fi
          if command -v ccache >/dev/null 2>&1; then
            ccache --version | head -1
          else
            echo "::warning::ccache unavailable - building without the compiler cache"
          fi

      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            out/build
            out/host-tools
          key: android-${{ env.LIBERTY_GPU }}-${{ env.LIBERTY_CPU }}-${{ env.LIBERTY_LTO }}-${{ github.sha }}
          restore-keys: |
            android-${{ env.LIBERTY_GPU }}-${{ env.LIBERTY_CPU }}-${{ env.LIBERTY_LTO }}-
            android-${{ env.LIBERTY_GPU }}-

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ env.LIBERTY_GPU }}-${{ env.LIBERTY_CPU }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ env.LIBERTY_GPU }}-${{ env.LIBERTY_CPU }}-

      - name: Fetch pinned dependencies and apply patches
        run: python tools/setup_repo.py

      - name: Build the Vulkan driver proxy
        run: |
          export ANDROID_HOME="$(cygpath -u "$ANDROID_HOME")"
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          bash os/android/scripts/build_driver_proxy.sh

      # The slow step. Its own timeout leaves time for the cache save below,
      # so a build that runs out of time keeps its progress for the next run.
      - name: Build the native libraries
        timeout-minutes: 320
        run: |
          export ANDROID_HOME="$(cygpath -u "$ANDROID_HOME")"
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          # The runner has 4 vCPUs. The script's default (nproc - 2, meant for
          # laptops that are also in use) leaves half of them idle.
          bash os/android/scripts/build_native.sh "$(nproc)"

      # The USA/NTSC game version is a separate recompilation (an older commit
      # of the public ZMOD-Liberty repository). Its libmain.so is built in its own tree and staged
      # as libmain_usa.so, so one APK runs both the PAL and the USA disc.
      - name: Restore USA build cache
        id: usacache
        uses: actions/cache/restore@v4
        with:
          path: usa-src/out/build
          key: android-usa-20dc1b2b-${{ env.LIBERTY_GPU }}-${{ env.LIBERTY_CPU }}
          restore-keys: |
            android-usa-20dc1b2b-

      - name: Build the USA libmain
        timeout-minutes: 220
        run: |
          export ANDROID_HOME="$(cygpath -u "$ANDROID_HOME")"
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          git fetch --depth 1 https://github.com/Benjamin-Wegener/ZMOD-Liberty.git 20dc1b2b420c8a64387759bcf23411fe9831a1d9
          # The cache restore already created usa-src/out/build: put it aside, check
          # the tree out (git refuses a non-empty directory) and move it back.
          [ -d usa-src ] && mv usa-src usa-cache
          git worktree add usa-src 20dc1b2b420c8a64387759bcf23411fe9831a1d9
          if [ -d usa-cache/out/build ]; then mkdir -p usa-src/out && mv usa-cache/out/build usa-src/out/build; fi
          (cd usa-src && python tools/setup_repo.py && bash os/android/scripts/build_native.sh "$(nproc)")
          cp usa-src/os/android/app/src/main/jniLibs/arm64-v8a/libmain.so \
             os/android/app/src/main/jniLibs/arm64-v8a/libmain_usa.so
          ls -la os/android/app/src/main/jniLibs/arm64-v8a/libmain*.so

      - name: Save USA build cache
        if: always() && steps.usacache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: usa-src/out/build
          key: android-usa-20dc1b2b-${{ env.LIBERTY_GPU }}-${{ env.LIBERTY_CPU }}

      - name: Save build cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            out/build
            out/host-tools
          key: android-${{ env.LIBERTY_GPU }}-${{ env.LIBERTY_CPU }}-${{ env.LIBERTY_LTO }}-${{ github.sha }}

      # Save even when the build failed: a timed-out or broken run still
      # primed ccache with every object it managed to compile.
      - name: Save ccache
        if: always() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ env.LIBERTY_GPU }}-${{ env.LIBERTY_CPU }}-${{ github.sha }}

      - name: Package the APK
        run: |
          export ANDROID_HOME="$(cygpath -u "$ANDROID_HOME")"
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          rm -f os/android/app/build/outputs/apk/debug/app-debug.apk
          bash os/android/scripts/build_apk.sh debug

      - name: Name the APK
        run: |
          VERSION="$(grep -o 'versionName *= *"[^"]*"' os/android/app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)"/\1/')"
          [ "$LIBERTY_GPU" = "mali" ] && VERSION="$VERSION-mali"
          SUFFIX="$(grep -o 'versionSuffix *= *"[^"]*"' os/android/app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)"/\1/')"
          VERSION="$VERSION$SUFFIX"
          [ "$LIBERTY_CPU" = "armv9" ] && VERSION="$VERSION-armv9"
          [ "$LIBERTY_LTO" = "thin" ] && VERSION="$VERSION-lto"
          cp os/android/app/build/outputs/apk/debug/app-debug.apk "LibertyRecompAndroid-$VERSION.apk"
          echo "APK_NAME=LibertyRecompAndroid-$VERSION.apk" >> "$GITHUB_ENV"
          ls -la LibertyRecompAndroid-*.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30
